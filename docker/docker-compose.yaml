services:
  tw-stock-monitor:
    image: nk7260ynpa/tw-stock-monitor:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tw-stock-server-monitor
    volumes:
      - ../logs:/app/logs
      # 查詢 CI 基礎設施容器（gitlab-runner / gitlab）狀態用；
      # 這些容器不 publish port，TCP 探測不到，只能看 container state。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "9102"
      # Alertmanager webhook 接收器（本地推播管道）
      - "9103"
    environment:
      - MONITOR_METRICS_PORT=9102
      - MONITOR_CHECK_INTERVAL=30
      - MONITOR_CHECK_TIMEOUT=5
      - MONITOR_CONTAINERS=gitlab-runner,gitlab,alertmanager
      - ALERT_RECEIVER_PORT=9103
      - ALERT_LOG_DIR=/app/logs/alerts
      # 容器內須以 host.docker.internal 才連得到 host 上的自架 GitLab
      - GITLAB_URL=${GITLAB_URL:-http://host.docker.internal:8080}
      # 權杖由 host 環境變數或 docker/.env 提供，切勿寫進版本控制
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_GROUP_ID=${GITLAB_GROUP_ID:-38}
      - GITLAB_CHECK_INTERVAL=300
    networks:
      - default
      - db_network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - default
      - db_network
    restart: always

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - default
      # 需與 Service Monitor 同網段才送得到 webhook 接收器
      - db_network
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: always
    depends_on:
      - prometheus

networks:
  db_network:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
