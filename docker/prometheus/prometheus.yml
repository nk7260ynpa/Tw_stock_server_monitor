global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警規則檔（由 docker-compose 以唯讀方式掛載 ./prometheus/rules）
# 觸發中的告警會以 ALERTS 序列存在 Prometheus 內，同時推送給 Alertmanager。
rule_files:
  - "/etc/prometheus/rules/*.yml"

# 告警推播：送往同一個 compose 堆疊內的 Alertmanager。
# 這段若遺失，規則照常評估但一則通知都不會送出（無聲失效），
# 故另有 PrometheusNotConnectedToAlertmanager 告警看守。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Linux 伺服器部署時使用（Docker 內的 Node Exporter）
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # macOS 環境使用（主機上直接執行的 exporter）
  - job_name: "macos-exporter"
    static_configs:
      - targets: ["host.docker.internal:9101"]

  # Tw_stock 服務健康檢查 + CI 基礎設施指標
  - job_name: "tw-stock-monitor"
    static_configs:
      - targets: ["tw-stock-server-monitor:9102"]

  # Alertmanager 自身指標（通知送不出去時由此看見）
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
